name: Cryostasis360 source validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required source files
        run: |
          test -f src/main.c
          test -f src/platform.c
          test -f src/resource.c
          test -f src/render.c
          test -f src/input.c
          test -f src/camera.c
          test -f include/cryostasis/platform.h
          test -f include/cryostasis/resource.h
          test -f include/cryostasis/render.h
          test -f include/cryostasis/input.h
          test -f include/cryostasis/camera.h
          test -f tests/resource_test.c
          test -f tests/render_test.c
          test -f tests/input_camera_test.c
          test -f Makefile
      - name: Compile and run host diagnostic (not Xbox 360 output)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude src/main.c src/platform.c src/resource.c src/render.c src/input.c src/camera.c -lm -o cryostasis360-host-test
          ./cryostasis360-host-test
      - name: Resource tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/resource_test.c src/resource.c -o cryostasis360-resource-test
          ./cryostasis360-resource-test
      - name: CPU renderer tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/render_test.c src/render.c -lm -o cryostasis360-render-test
          ./cryostasis360-render-test
      - name: Input and camera tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/input_camera_test.c src/input.c src/camera.c -lm -o cryostasis360-input-camera-test
          ./cryostasis360-input-camera-test
